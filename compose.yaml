name: riftlab

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riftlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riftlab}
      POSTGRES_DB: ${POSTGRES_DB:-riftlab}
    volumes:
      - riftlab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riftlab} -d ${POSTGRES_DB:-riftlab}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["api"]
    environment:
      RIFTLAB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-riftlab}:${POSTGRES_PASSWORD:-riftlab}@db:5432/${POSTGRES_DB:-riftlab}
      RIFTLAB_LOG_LEVEL: ${RIFTLAB_LOG_LEVEL:-INFO}
      RIFTLAB_RIOT_API_KEY: ${RIFTLAB_RIOT_API_KEY:-}
      # Mesmo segredo do worker: a lápide do expurgo (HMAC) só é reconhecida pela API
      # se os dois usarem o mesmo valor (CC-603/605).
      RIFTLAB_SUBJECT_HASH_SECRET: ${RIFTLAB_SUBJECT_HASH_SECRET:-}
      # Interpretador de objetivo (CC-504): regras por padrão; modelo local só explícito.
      RIFTLAB_OBJECTIVE_PARSER: ${RIFTLAB_OBJECTIVE_PARSER:-rules}
      RIFTLAB_OBJECTIVE_MODEL_URL: ${RIFTLAB_OBJECTIVE_MODEL_URL:-}
      RIFTLAB_OBJECTIVE_MODEL_VERSION: ${RIFTLAB_OBJECTIVE_MODEL_VERSION:-local_model_unversioned}
      RIFTLAB_DEMO_RANKED: ${RIFTLAB_DEMO_RANKED:-false}
      # Dentro do container o bind é em todas as interfaces; a porta só é publicada em
      # 127.0.0.1. O proxy do frontend chega com Host `api` (CC-1215).
      RIFTLAB_API_HOST: 0.0.0.0
      RIFTLAB_API_ALLOWED_HOSTS: '["127.0.0.1", "localhost", "::1", "api"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Corpos brutos gravados pelo worker, só para leitura: a tela da partida mostra o Riot ID
      # dos participantes lido daqui na hora (CC-1210), sem guardá-lo no banco.
      - riftlab_raw_data:/app/data/raw:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health/live',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["worker"]
    environment:
      RIFTLAB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-riftlab}:${POSTGRES_PASSWORD:-riftlab}@db:5432/${POSTGRES_DB:-riftlab}
      RIFTLAB_LOG_LEVEL: ${RIFTLAB_LOG_LEVEL:-INFO}
      RIFTLAB_RIOT_API_KEY: ${RIFTLAB_RIOT_API_KEY:-}
      # HMAC de subject_hash (CC-201): só exigido quando um job RIOT de
      # verdade precisa persistir participantes; DEMO nunca depende disso.
      RIFTLAB_SUBJECT_HASH_SECRET: ${RIFTLAB_SUBJECT_HASH_SECRET:-}
    volumes:
      # Corpos brutos match+timeline (CC-201) — durável entre reinícios do
      # worker, distinto do volume de dados do Postgres. Caminho corresponde
      # ao default de Settings.raw_storage_dir (/app/data/raw/imports).
      - riftlab_raw_data:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import os,time,sys; p='/tmp/riftlab-worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<30 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      RIFTLAB_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  riftlab_postgres_data:
  riftlab_raw_data:
