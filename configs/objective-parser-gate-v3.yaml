    de geração; carregar e mesclar adaptador conforme evaluate.py congelado. Conferir hashes antes de
    carregar. Download da base antes das execuções. Sem ajuste posterior ao teste, mesmo com resultado
    negativo. Os resumos usam arredondamento do metrics.py congelado; o comparador aplica todos os quatro
    limiares, inclusive latência.
