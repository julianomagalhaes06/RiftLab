    rulesV2Passes: rules_v2 torna-se o padrão RULES após auditar retorno e validar backend.
    onlyLoraPasses: Padrão segue rules_v1 até decisão explícita sobre provedor LOCAL_MODEL e ambiente
      onde o modelo será servido.
    nonePasses: Padrão segue rules_v1. Teste v3 passa a desenvolvimento; nova versão exige novo teste.
  retryPolicy: Métricas produzidas nunca permitem repetir, inclusive após falha posterior. Execução concluída
    é reutilizada com hashes. Falha técnica sem métricas requer revisão, registro de causa e retry explícito;
    tentativa interrompida sem conclusão não é retomada automaticamente. Journal, logs e resultados no
    Drive persistem entre sessões; não apagar nem usar dois notebooks em paralelo.
