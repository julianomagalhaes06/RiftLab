    evidence: "CC-802: confirmação pré-registrada (protocolo v5) no patch 16.20, fila 420, G-FINAL 4/122 (sup Wilson 0.0813) com R1, R2, R2i, R4s, R4w, R5, R7b, R7m, R8; auditoria única f06aef0b"
