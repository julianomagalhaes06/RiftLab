<html lang="pt-BR">

    <title>RiftLab</title>
    <!-- Tema escolhido antes da primeira pintura, para a página não piscar no tema errado. -->

        if (localStorage.getItem("riftlab:theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (error) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
