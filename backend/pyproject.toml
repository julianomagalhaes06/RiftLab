[project]
name = "riftlab"
version = "0.1.0"
description = "RiftLab — monolito de revisao pos-partida de decisoes de compra em League of Legends"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.13,<2",
  "typer>=0.15,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "argon2-cffi>=23.1,<26",
]

[project.scripts]
cc = "riftlab.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0,<7",
]
ml = [
    "catboost>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riftlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 ignora parametros com tipo imutavel (str/int/bool), mas Path nao entra
# nessa lista; typer.Option/typer.Argument sao o idioma padrao do projeto desde
# o CC-101 e nunca reavaliam o default em cada chamada (Typer os executa uma vez
# na construcao do comando), entao sao seguros aqui — mecanismo documentado pelo
# proprio ruff para este caso exato (rule B008).
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
packages = ["riftlab"]
ignore_missing_imports = true
