name: Board

# Automação do board RiftLab (o GitHub não deixa configurar as automações nativas do board pela
# API, então as regras ficam aqui):
#   - commit com "refs #N" leva o card N para "Em andamento";
#   - issue aberta entra no board em "Backlog"; reaberta volta para "Em andamento";
#     fechada (inclusive por "Closes #N" num commit) vai para "Concluído".
on:
  push:
    branches: ["**"]
  issues:
    types: [opened, reopened, closed]

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Atualizar o board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: julianomagalhaes06
          PROJECT_NUMBER: "2"
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret PROJECT_TOKEN ausente; nada a fazer."
            exit 0
          fi
          if [ "$EVENT" = "issues" ]; then
            bash .github/scripts/board-progress.sh issue "$ISSUE" "$ACTION"
          else
            jq -r '.commits[]?.message' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/messages.txt"
            bash .github/scripts/board-progress.sh commits "$RUNNER_TEMP/messages.txt"
          fi
