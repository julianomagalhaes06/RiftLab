name: CI

on:
  push:
    branches: [main]
  pull_request:

# Só leitura do repositório; nenhum job precisa escrever (CC-1220).
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Runner travado não segura o CI por horas (40370740490 parou ~50 min no Playwright).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: riftlab_test
          POSTGRES_PASSWORD: riftlab_test
          POSTGRES_DB: riftlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riftlab_test -d riftlab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RIFTLAB_DATABASE_URL: postgresql+asyncpg://riftlab_test:riftlab_test@localhost:5432/riftlab_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.12.13"

      - name: Instalar dependencias travadas (uv.lock)
        working-directory: backend
        run: uv sync --frozen --group ml

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Formatacao (ruff format --check)
        working-directory: backend
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        working-directory: backend
        run: uv run mypy src

      - name: Testes (pytest, banco isolado)
        working-directory: backend
        run: uv run pytest -v

      - name: Protocolo do gate v3 (fixtures ficticias, sem modelos ou teste reservado)
        working-directory: backend
        run: uv run python -m unittest discover -s ../ml/objectives/colab -p test_gate_v3_runner.py -v

      - name: Contrato HTTP do interpretador quantizado (sem carregar modelos)
        working-directory: backend
        run: uv run pytest ../ml/objectives/local/test_serve_llama.py ../ml/objectives/local/test_unix_sidecar.py -q

      - name: Validar configuração optativa da demonstração com LLM (sem subir serviços)
        working-directory: .
        run: bash scripts/local_llm_demo.sh config

      - name: Build da imagem runtime
        run: docker build --target runtime -f backend/Dockerfile -t riftlab-api:ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias travadas (package-lock.json)
        working-directory: frontend
        run: npm ci

      - name: Tipos TS gerados do OpenAPI sem drift (backend/openapi.json)
        working-directory: frontend
        run: npm run check:api-types

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Testes unitarios (vitest)
        working-directory: frontend
        run: npm run test

      - name: Instalar navegador do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E com API simulada (Playwright, health, falhas recuperáveis, 360 px, teclado e protótipo)
        working-directory: frontend
        run: npm run test:e2e

      - name: Build de producao
        working-directory: frontend
        run: npm run build

      - name: Build da imagem runtime
        run: docker build -f frontend/Dockerfile -t riftlab-frontend:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build das imagens
        run: docker compose build

      - name: Subir stack completa
        run: docker compose up -d --wait

      - name: Verificar live/ready/frontend saudaveis
        run: |
          curl -sf http://127.0.0.1:8000/health/live
          curl -sf http://127.0.0.1:8000/health/ready
          curl -sf http://127.0.0.1:5173/ > /dev/null

      - name: Aplicar migrations no banco da stack
        run: docker compose run --rm api db upgrade

      - name: Fluxo import demo -> partida preparada -> decisões (só API)
        run: python3 scripts/smoke_import_flow.py --base-url http://127.0.0.1:8000 --timeout 180

      - name: Deep links do frontend (fallback SPA) e proxy da API
        run: |
          for path in "/matches/DEMO-0008?participant=1" "/imports/688bd44d-39b7-4f7b-956b-0fd4a63cfafd" "/decisions/0f92d8d8-319c-4fa4-bca3-49157a1f9e00" "/prototipo"; do
            curl -sf -H 'Accept: text/html' "http://127.0.0.1:5173$path" | grep -q 'id="root"'
          done
          # Login exigido por padrão: a leitura pública passa pelo proxy sem sessão; a lista da
          # conta própria recusa sem sessão e responde com uma conta criada pelo proxy (cookie +
          # cabeçalho anti-CSRF).
          curl -sf http://127.0.0.1:5173/api/v1/matches/DEMO-0008 | python3 -c 'import json,sys; assert json.load(sys.stdin)["matchId"] == "DEMO-0008"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/api/v1/matches)" = 401
          curl -sf -c "$RUNNER_TEMP/riftlab.jar" -X POST -H 'X-RiftLab-Request: 1' -H 'Content-Type: application/json' \
            -d "{\"username\":\"ci_$GITHUB_RUN_ID\",\"password\":\"$(openssl rand -hex 16)\"}" \
            http://127.0.0.1:5173/api/v1/auth/register > /dev/null
          curl -sf -b "$RUNNER_TEMP/riftlab.jar" http://127.0.0.1:5173/api/v1/matches | python3 -c 'import json,sys; assert "items" in json.load(sys.stdin)'

      # E2E da demonstração contra a stack REAL: roda AQUI (e não no job `frontend`) porque este
      # é o único job com api + worker + PostgreSQL + frontend no ar e já migrados; o job
      # `frontend` mantém os specs com API simulada, rápidos e sem backend.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias e navegador do Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E da demonstração na stack real (Playwright, projeto real-stack)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e:stack

      - name: Readiness acompanha o banco
        run: |
          docker compose stop db
          sleep 3
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/ready)
          test "$status" = "503"
          docker compose start db
          timeout 30 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" riftlab-db-1)" = "healthy" ]; do sleep 1; done'
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/ready)
          test "$status" = "200"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Encerrar stack
        if: always()
        run: docker compose down -v
