[project]
name = "riftlab-objectives"
version = "0.1.0"
description = "RiftLab — corpus, ajuste LoRA em CPU e avaliacao do interpretador de objetivo (CC-501/503)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1",
  "transformers>=4.46,<4.47",
  "peft>=0.13,<0.14",
  "accelerate>=1.1,<2",
  "huggingface-hub>=0.26,<1",
  "pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
