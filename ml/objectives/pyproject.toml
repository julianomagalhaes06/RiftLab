[project]
name = "riftlab-objectives"
version = "0.1.0"
description = "RiftLab — corpus, ajuste LoRA em CPU e avaliacao do interpretador de objetivo (CC-501/503, pilha CC-1301)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1",
  "transformers>=5.19,<5.20",
  "peft>=0.21,<0.22",
  "accelerate>=1.1,<2",
  "huggingface-hub>=1.31,<2",  # 2.x troca httpx por httpx2 (e dependências novas)
  "pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
